[project]
name = "learning-assistant-mcp-server"
version = "0.1.0"
description = "MCP capability server for the AI Learning Assistant (web search)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=14.0.0",
    "fastmcp>=3.4.7",
    "httpx>=0.28.0",
    "markdown>=3.7",
    "pydantic-settings>=2.14.2",
    "tavily-python>=0.7.0",
    "weasyprint>=63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits the real search provider; needs TAVILY_API_KEY",
]

[tool.ruff]
target-version = "py313"
